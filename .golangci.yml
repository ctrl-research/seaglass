version: "2"
linters:
  default: standard
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - misspell
    - revive
  settings:
    revive:
      rules:
        # Interface methods legitimately leave some parameters unused in a
        # given implementation (e.g. render(width, height) that ignores width).
        - name: unused-parameter
          disabled: true
formatters:
  enable:
    - gofmt
    - goimports
